<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Sketchfab 練習</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f5f5f5;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #333;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 700px;
            max-width: 90%;
            margin: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        iframe {
            width: 100%;
            height: 400px;
            border-radius: 10px;
            margin-top: 15px;
        }

        a {
            color: #ff7f50;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        .back {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Sketchfab 模型展示</h1>

    <div class="container">
        <p>
            🔗 <a href="https://skfb.ly/pHQzt" target="_blank">
                原始模型頁面
            </a>
        </p>

        <iframe 
            src="https://sketchfab.com/models/4b9805437f64437db609a45441d081b0/embed"
            allow="autoplay; fullscreen; xr-spatial-tracking">
        </iframe>

        <a class="back" href="index.html">← 回首頁</a>
    </div>

</body>
</html>
