<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Basic Viewer</title>
    <script src="https://cdn.babylonjs.com/viewer/babylon.viewer.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            text-align: center;
            padding: 40px;
        }

        .container {
            background: white;
            padding: 20px;
            width: 600px;
            max-width: 90%;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        babylon {
            width: 100%;
            height: 400px;
            display: block;
        }

        a {
            display: block;
            margin-top: 15px;
            color: #ff7f50;
            text-decoration: none;
        }
    </style>
</head>

<body>

<h1>Basic Viewer</h1>

<div class="container">
    <babylon model="./models/yamaguchi.glb"></babylon>
    <a href="index.html">← 回首頁</a>
</div>

</body>
</html>
